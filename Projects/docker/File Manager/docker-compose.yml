services:
  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    user: "root:root"   # força rodar como root (UID 0, GID 0)
    hostname: host.internal.filebrowser 
    volumes:
      - ../../:/srv
      - ./database:/database
    command: --root=/srv --database /database/filebrowser.db
    ports:
      - "8082:80"
    networks:
      - internal
    
networks:
  internal:
    driver: bridge
